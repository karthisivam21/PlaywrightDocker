
services:

  playwright:
    build: .
    container_name: playwright-tests
    working_dir: /app

    volumes:
      - .:/app
      - ./allure-results:/app/allure-results

    environment:
      - CI=true

    command: >
      sh -c "
      mkdir -p /app/allure-results &&
      npx playwright test --reporter=line,allure-playwright
      "


  allure:
    image: frankescobar/allure-docker-service
    container_name: allure-ui

    ports:
      - "5050:5050"

    environment:
      CHECK_RESULTS_EVERY_SECONDS: 2
      KEEP_HISTORY: 0

    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/default-reports